version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: addressbook-postgres
    environment:
      POSTGRES_DB: addressbook
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - addressbook-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: addressbook-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: kafka-cluster-1
    ports:
      - "9092:9092"
    networks:
      - addressbook-network

  addressbook-app:
    build: .
    container_name: addressbook-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/addressbook
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
    networks:
      - addressbook-network

volumes:
  postgres_data:

networks:
  addressbook-network:
    driver: bridge